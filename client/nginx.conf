server {
  listen 8080;
  root /usr/share/nginx/html;

  # Screenshot uploads are capped at 5 MB by the API
  client_max_body_size 6m;

  # One origin for the browser: API calls go to the server container
  location /api/ {
    proxy_pass http://server:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Hashed build assets never change, so they can be cached for a long time
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Client-side routes fall back to the React app
  location / {
    try_files $uri /index.html;
  }
}
